name: Release Chrome Extension

# Triggered when a `v*` tag is pushed (e.g. `v0.1.0`). The job verifies that
# the tag matches package.json/manifest.json, builds the extension, packages
# it into a Chrome Web Store-ready zip, and attaches the zip to a GitHub
# Release.
#
# To cut a release locally:
#   1. Bump `version` in BOTH package.json and manifest.json (must match).
#   2. `npm run release:check` to sanity-check the version sync.
#   3. `git commit -am "chore: release vX.Y.Z" && git tag vX.Y.Z`
#   4. `git push origin main --tags`
#
# The workflow then produces `omni-viewer-X.Y.Z.zip` as a release asset.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG_VERSION) must match package.json ($PACKAGE_VERSION) and manifest.json ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package zip
        run: node scripts/package.mjs

      - name: Locate zip
        id: zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_PATH="dist/omni-viewer-${VERSION}.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Expected $ZIP_PATH but it does not exist."
            exit 1
          fi
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-viewer-${{ steps.zip.outputs.version }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
