name: Release Chrome Extension

# Triggered when a `v*` tag is pushed (e.g. `v0.1.0`). The job verifies that
# the tag matches package.json/manifest.json, builds the extension, packages
# it into a Chrome Web Store-ready zip, and attaches the zip to a GitHub
# Release, then submits it to the Chrome Web Store when configured.
# One-time account setup: store/automatic-publishing.md.
#
# To cut a release locally:
#   1. Bump `version` in BOTH package.json and manifest.json (must match).
#   2. `npm run release:check` to sanity-check the version sync.
#   3. `git commit -am "chore: release vX.Y.Z" && git tag vX.Y.Z`
#   4. `git push origin main --tags`
#
# The workflow then produces `omni-viewer-X.Y.Z.zip` as a release asset.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and submit (e.g. v0.11.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v0.11.0."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG_VERSION) must match package.json ($PACKAGE_VERSION) and manifest.json ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci -- --runInBand

      - name: Build
        run: npm run build

      - name: Package zip
        run: node scripts/package.mjs

      - name: Locate zip
        id: zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP_PATH="dist/omni-viewer-${VERSION}.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Expected $ZIP_PATH but it does not exist."
            exit 1
          fi
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-viewer-${{ steps.zip.outputs.version }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.zip.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain Web Store setup
        if: vars.CWS_PUBLISH_ENABLED != 'true'
        run: echo 'Chrome Web Store submission is disabled. See store/automatic-publishing.md to enable it.' >> "$GITHUB_STEP_SUMMARY"

  webstore:
    name: Submit to Chrome Web Store
    needs: release
    if: vars.CWS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Do not interrupt an upload or submission when another release starts.
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: false
    env:
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
      CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      # Use this workflow's scripts even when manually releasing an older tag.
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify publishing configuration
        run: |
          for name in CWS_PUBLISHER_ID CWS_EXTENSION_ID CWS_SERVICE_ACCOUNT CWS_WORKLOAD_IDENTITY_PROVIDER; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name. See store/automatic-publishing.md."
              exit 1
            fi
          done

      - name: Test publisher
        run: node --test scripts/__tests__/publish-webstore.test.mjs

      - name: Download tested release zip
        uses: actions/download-artifact@v4
        with:
          name: omni-viewer-${{ needs.release.outputs.version }}
          path: release-package

      - name: Authenticate to Chrome Web Store
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/publish-webstore.mjs "release-package/omni-viewer-${RELEASE_VERSION}.zip"
