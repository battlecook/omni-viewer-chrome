<!doctype html>
<!--
  Per-viewer entry shell for the video viewer.

  This page is intentionally minimal. It loads the bundled per-viewer JS
  produced by webpack at `dist/templates/video/videoViewer.js`. The bundled
  module self-bootstraps when it sees a `data-viewer="video"` host element
  in the DOM and reads `?src=<blob-url>` from the query string.

  This page is for manual debugging only. Production traffic flows through
  `src/router.ts` (the registry-driven dispatcher), which calls
  `mountVideoViewer(file, container)` directly — no navigation through this
  HTML page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omni Viewer — Video</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="css/videoViewer.css">
</head>
<body>
  <main class="app">
    <section id="viewer" class="viewer" data-viewer="video"></section>
  </main>
  <script type="module" src="../../../dist/templates/video/videoViewer.js"></script>
</body>
</html>
