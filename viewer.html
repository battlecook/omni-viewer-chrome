<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omni Viewer</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <section id="dropZone" class="drop-zone" role="button" tabindex="0">
      <div class="drop-copy">
        <strong data-i18n="dropPrompt">Drop a file here</strong>
        <span data-i18n="formatsSummary">Images, PDF, CSV/TSV, JSON/JSONL, YAML/TOML, media, Office, PSD, Parquet, HWP/HWPX, archives</span>
      </div>
      <input id="fileInput" type="file" hidden>
    </section>

    <section id="fileMeta" class="file-meta hidden"></section>
    <section id="status" class="status hidden"></section>
    <section id="viewer" class="viewer"></section>
  </main>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/docx-preview.min.js"></script>
  <script src="vendor/mammoth.browser.min.js"></script>
  <script src="vendor/audio_engine_browser.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
