<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omni Viewer</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app">
    <header class="app-toolbar">
      <div>
        <strong>Omni Viewer</strong>
        <span data-i18n="supportSummary">Local multi-format file viewer</span>
      </div>
      <div class="app-toolbar-actions">
        <button id="openSharedLink" type="button">Open Link</button>
        <button id="shareCurrentFile" type="button" disabled
          title="Share with Omni Viewer. Shared data is stored on the server for 5 minutes only, then discarded.">Share</button>
        <label class="language-picker" data-i18n-title="languageButtonTitle" title="Language">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"></path>
          </svg>
          <select id="languageSelect" data-i18n-aria-label="languageButtonTitle" aria-label="Language"></select>
        </label>
      </div>
    </header>
    <section id="dropZone" class="drop-zone" role="button" tabindex="0">
      <div class="drop-copy">
        <strong data-i18n="dropPrompt">Drop a file here</strong>
        <span data-i18n="formatsSummary">Images, PDF, CSV/TSV, JSON/JSONL, HAR, Jupyter, YAML/TOML, Proto, NumPy, GGUF, ONNX, TFLite, ExecuTorch, Keras, Core ML, OpenVINO, Safetensors, media, Office, PSD, Parquet, HWP/HWPX, archives</span>
      </div>
      <input id="fileInput" type="file" multiple hidden>
    </section>

    <section id="fileMeta" class="file-meta hidden"></section>
    <section id="status" class="status hidden"></section>
    <section id="viewer" class="viewer"></section>
  </main>
  <aside id="shareToast" class="share-toast hidden" role="status" aria-live="polite">
    <strong>Share link copied</strong>
    <a id="shareToastLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    <span>Expires in 5 minutes</span>
  </aside>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/docx-preview.min.js"></script>
  <script src="vendor/mammoth.browser.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
